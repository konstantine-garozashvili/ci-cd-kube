name: 🚀 CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # =========================================================================
  # Static checks on the scaffolder's own source
  # =========================================================================
  quality:
    name: 🛡️ Lint, Test & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: 🎨 Check formatting
        run: npm run format:check

      - name: 🧹 Lint
        run: npm run lint

      - name: 🛡️ Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: 🔍 SAST scan
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config="p/owasp-top-ten" --error --metrics=off bin lib

      - name: 🧪 Generator unit tests
        run: npm run test:coverage

  # =========================================================================
  # Scaffold real projects and run THEIR gates against them.
  #
  # This is the check that keeps the templates honest: a generated project that
  # cannot lint, build or test itself fails here, not in a user's first five
  # minutes.
  # =========================================================================
  scaffold-smoke:
    name: 🏗️ Smoke (${{ matrix.combination }})
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        combination:
          - express-react-postgres
          - express-vanilla-none
          - hono-vue-mongodb
          - nestjs-nextjs-postgres
          - express-api-only
          - hono-api-only
          - nestjs-api-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🏗️ Scaffold and verify
        run: node scripts/smoke.js --only=${{ matrix.combination }} --e2e

  # =========================================================================
  # Build the container images a generated project would produce.
  # Nothing is published — this only proves the Dockerfiles are buildable.
  # =========================================================================
  docker-smoke:
    name: 🐳 Generated image builds
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: 🏗️ Scaffold a fullstack project
        run: node bin/cli.js docker-check --defaults --no-git --backend=express --frontend=react --database=postgres

      - name: 🐳 Lint the generated Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:latest-alpine hadolint --failure-threshold error - < docker-check/backend/Dockerfile
          docker run --rm -i hadolint/hadolint:latest-alpine hadolint --failure-threshold error - < docker-check/frontend/Dockerfile

      - name: 🏗️ Build the backend image
        working-directory: docker-check
        run: docker build -f backend/Dockerfile -t smoke-backend .

      - name: 🏗️ Build the frontend image
        working-directory: docker-check
        run: docker build -f frontend/Dockerfile -t smoke-frontend .

      - name: ✅ Boot the backend image and probe it
        run: |
          docker run -d --name smoke-api -p 3000:3000 \
            -e NODE_ENV=development \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:5432/none \
            smoke-backend
          npx --yes wait-on http://127.0.0.1:3000/healthz --timeout 60000
          echo "Liveness:"  && curl -fsS http://127.0.0.1:3000/healthz
          echo "API info:"  && curl -fsS http://127.0.0.1:3000/api/info
          docker rm -f smoke-api

  # =========================================================================
  # Publish to npm on a v* tag
  # =========================================================================
  publish:
    name: 📦 Publish to npm
    runs-on: ubuntu-latest
    needs: [quality, scaffold-smoke, docker-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      - name: 🔍 Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: 📦 Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
