# Secret scanning profile for the scaffolder itself.
title = "laplateforme-starter secret scan profile"

[extend]
useDefault = true

[allowlist]
description = "Template placeholders are not real credentials"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^templates/''',
  '''^lib/generators/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)docs/''',
]
regexes = [
  '''postgresql://postgres:postgres@''',
  '''postgresql://test_user:test_password@''',
]
