<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Plateforme — DevSecOps Starter</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #080c14;
      --card-bg: #0f172a;
      --border-color: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-purple: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .container {
      max-width: 780px;
      width: 100%;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p.subtitle { color: var(--text-muted); font-size: 1rem; }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      margin-top: 0.85rem;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* System Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 2rem;
    }
    .item {
      background: #1e293b;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .item label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .item div {
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #f1f5f9;
      margin-top: 0.2rem;
    }

    /* Live Route Tester */
    .tester-section {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .tester-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .tester-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .route-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .route-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .route-btn:hover {
      background: #334155;
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }
    .route-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    
    .response-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="app-card">
      
      <div class="header">
        <h1 id="app-title">🏛️ La Plateforme Starter</h1>
        <p class="subtitle">Cloud-Native Architecture with Shift-Left Security & 3-Tier Testing</p>
        
        <div class="status-badge" id="status-badge">
          <span class="pulse"></span> System Operational (HTTP 200)
        </div>
      </div>

      <div class="grid">
        <div class="item">
          <label>Healthcheck</label>
          <div id="health-status">UP (200 OK)</div>
        </div>
        <div class="item">
          <label>Security Headers</label>
          <div id="security-status">Helmet Protected</div>
        </div>
        <div class="item">
          <label>Testing Suite</label>
          <div id="testing-status">Unit + Integ + E2E</div>
        </div>
        <div class="item">
          <label>Containerization</label>
          <div id="docker-status">Multi-Stage Alpine</div>
        </div>
      </div>

      <!-- Live Route Tester -->
      <div class="tester-section">
        <div class="tester-header">
          <div class="tester-title">⚡ Live Endpoint Explorer</div>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Click any route to test live</span>
        </div>

        <div class="route-buttons">
          <button class="route-btn active" id="btn-health">GET /healthz</button>
          <button class="route-btn" id="btn-ready">GET /ready</button>
          <button class="route-btn" id="btn-info">GET /api/info</button>
          <button class="route-btn" id="btn-metrics">GET /api/metrics</button>
          <button class="route-btn" id="btn-echo">POST /api/echo</button>
        </div>

        <div class="response-box" id="response-output">Loading endpoint data...</div>
      </div>

    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
